<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sảnh Văn Phòng AI</title>
<meta name="description" content="Sảnh Văn Phòng AI trên điện thoại: ai đang online, nhắn tin với đồng nghiệp.">
<meta name="author" content="LTN">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sảnh AI">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="icon" href="/m/icon-192.png">
<link rel="apple-touch-icon" href="/m/apple-touch-icon.png">
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --ink: #141824; --sub: #5b6476; --line: #e3e7ef; --soft: #eef2f9;
  --brand: #2563eb; --brand-ink: #ffffff; --mine: #2563eb; --mine-ink: #ffffff; --theirs: #ffffff;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --mention: #fff4d6; --shadow: 0 1px 2px rgba(20,24,36,.06), 0 4px 16px rgba(20,24,36,.06);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11141b; --card: #1a1f2a; --ink: #eef1f7; --sub: #9aa4b6; --line: #2a3140; --soft: #212838;
    --brand: #5b8cff; --brand-ink: #0b1020; --mine: #3b6ff5; --mine-ink: #ffffff; --theirs: #1f2533; --mention: #3a3220; --shadow: none; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---------- đăng nhập ---------- */
.login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
  padding: calc(24px + var(--safe-t)) max(24px, env(safe-area-inset-right)) calc(24px + var(--safe-b)) max(24px, env(safe-area-inset-left)); }
.login img { width: 84px; height: 84px; border-radius: 22px; box-shadow: var(--shadow); }
.login h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; text-wrap: balance; }
.login p { margin: 0; color: var(--sub); max-width: 34ch; }
.steps { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 10px; width: min(100%, 360px); text-align: left; }
.steps li { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.steps b { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--brand); display: grid; place-items: center; font-size: 13px; }
.login .err { color: var(--bad); font-weight: 600; }
.credit { font-size: 12px; color: var(--sub); opacity: .8; }
.codebox { display: flex; gap: 8px; width: min(100%, 360px); }
.codebox input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px; font: inherit; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; text-align: center; font-weight: 700; }
.codebox button { padding: 0 18px; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.or { font-size: 13px; color: var(--sub); }

/* ---------- khung chính ---------- */
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--safe-t)) max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
  background: var(--card); border-bottom: 1px solid var(--line); min-height: 56px; }
.top h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top small { display: block; font-size: 12px; color: var(--sub); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.iconbtn:active { background: var(--soft); }
.iconbtn svg { width: 22px; height: 22px; }
.net { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
.net.on { background: var(--ok); }
.banner { flex: none; padding: 8px 14px; font-size: 13px; background: var(--mention); color: var(--ink); text-align: center; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
.tabs { flex: none; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs button { flex: 1; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--sub); position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--brand); font-weight: 600; }
.tabs .dot { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

/* danh sách */
.list { padding: 8px max(10px, env(safe-area-inset-right)) 16px max(10px, env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; text-align: left; width: 100%; min-width: 0; }
.row:active { background: var(--soft); }
.row .grow { flex: 1; min-width: 0; }
.row b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { display: block; font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--sub); flex: none; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font-size: 12px; line-height: 20px; font-weight: 700; text-align: center; }
.badge.at { background: var(--bad); color: #fff; }
.unread b { font-weight: 800; }
.head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); padding: 14px 10px 6px; }
.empty { color: var(--sub); text-align: center; padding: 40px 20px; }
.av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; position: relative; font-size: 16px; }
.av.sm { width: 32px; height: 32px; font-size: 13px; }
.av .on { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2px solid var(--card); }
.av.all { background: linear-gradient(135deg, #2563eb, #7c3aed); }
.search { margin: 10px max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); display: flex; }
.search input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; }

/* đoạn chat */
.msgs { padding: 10px max(10px, env(safe-area-inset-right)) 12px max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 2px; }
.more { align-self: center; margin: 4px 0 10px; font-size: 13px; color: var(--brand); padding: 6px 12px; border-radius: 16px; background: var(--soft); }
.day { align-self: center; font-size: 12px; color: var(--sub); margin: 12px 0 6px; }
.m { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.m.mine { flex-direction: row-reverse; }
.m .av { visibility: hidden; }
.m.first .av { visibility: visible; }
.m.first { margin-top: 8px; }
.bub { max-width: min(78%, 520px); min-width: 0; background: var(--theirs); border: 1px solid var(--line); border-radius: 18px; padding: 7px 12px; box-shadow: var(--shadow); text-align: left; }
.mine .bub { background: var(--mine); color: var(--mine-ink); border-color: transparent; }
.bub .who { font-size: 12px; font-weight: 700; color: var(--brand); margin-bottom: 1px; }
.mine .bub .who { display: none; }
.bub .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.bub .txt a { color: inherit; text-decoration: underline; }
.bub .tm { font-size: 11px; opacity: .65; text-align: right; margin-top: 2px; }
.bub.hit { background: var(--mention); }
.mine .bub.hit { background: var(--mine); }
.at { font-weight: 700; color: var(--brand); }
.mine .at { color: inherit; text-decoration: underline; }
.quote { font-size: 13px; border-left: 3px solid currentColor; opacity: .75; padding: 2px 8px; margin: 2px 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.imgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 4px 0 2px; }
.imgs.one { grid-template-columns: minmax(0, 1fr); }
.imgs button { border-radius: 12px; overflow: hidden; background: var(--soft); aspect-ratio: 4 / 3; max-width: 100%; }
.imgs img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ô nhập */
.compose { flex: none; background: var(--card); border-top: 1px solid var(--line); padding: 8px max(10px, env(safe-area-inset-right)) calc(8px + var(--safe-b)) max(10px, env(safe-area-inset-left)); }
.compose .reply { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); padding: 0 4px 6px; }
.compose .reply span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compose .bar { display: flex; align-items: flex-end; gap: 6px; }
.compose textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 20px; padding: 9px 14px; font: inherit; font-size: 16px; max-height: 130px; line-height: 1.35; }
.send { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .45; }
.send svg, .pick svg { width: 20px; height: 20px; }
.pick { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--sub); flex: none; }
.pending { display: flex; gap: 6px; padding: 0 2px 8px; overflow-x: auto; }
.pending div { position: relative; flex: none; }
.pending img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; display: block; }
.pending button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 22px; }
.sugg { display: flex; gap: 6px; overflow-x: auto; padding: 0 2px 8px; }
.sugg button { flex: none; padding: 6px 12px; border-radius: 16px; background: var(--soft); font-size: 14px; }
.note { font-size: 13px; color: var(--sub); text-align: center; padding: 4px 8px; text-wrap: balance; }

/* bảng thao tác + xem ảnh */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; z-index: 20; }
.sheet .box { width: 100%; background: var(--card); border-radius: 18px 18px 0 0; padding: 8px max(10px, env(safe-area-inset-right)) calc(10px + var(--safe-b)) max(10px, env(safe-area-inset-left)); display: grid; gap: 2px; }
.sheet .box button { padding: 14px; border-radius: 12px; text-align: left; font-size: 16px; }
.sheet .box button:active { background: var(--soft); }
.sheet .box .bad { color: var(--bad); }
.viewer { position: fixed; inset: 0; background: #000; z-index: 30; display: grid; place-items: center; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer button { position: absolute; top: calc(10px + var(--safe-t)); right: 12px; color: #fff; width: 44px; height: 44px; font-size: 26px; }
/* ---------- Sảnh 3D ---------- */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; background: linear-gradient(180deg, #cfe3f7, #eef3fa); touch-action: none; -webkit-user-select: none; user-select: none; }
@media (prefers-color-scheme: dark) { .stage { background: linear-gradient(180deg, #1c2638, #121722); } }
.stage .scene { position: absolute; inset: 0; }
.stage .msg3d { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--sub); }
.ov { position: absolute; z-index: 6; display: flex; gap: 8px; }
.ov.tl { top: 10px; left: max(10px, env(safe-area-inset-left)); flex-direction: column; align-items: flex-start; max-width: 60%; }
.ov.tr { top: 10px; right: max(10px, env(safe-area-inset-right)); flex-direction: column; }
.fab { width: 46px; height: 46px; border-radius: 50%; background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(20,24,36,.14); display: grid; place-items: center; font-size: 20px; position: relative; flex: none; }
.fab:active, .pill:active { transform: scale(.94); }
.fab.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.fab .live { position: absolute; top: 2px; right: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--bad); border: 2px solid var(--card); }
.pill { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 14px 4px 4px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(20,24,36,.14); max-width: 100%; }
.pill .av { width: 32px; height: 32px; font-size: 12px; }
.pill span { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.st { padding: 4px 14px; font-size: 13px; }
.joy { position: absolute; z-index: 6; left: max(18px, calc(env(safe-area-inset-left) + 10px)); bottom: 18px; width: 132px; height: 132px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,.42)); border: 2px solid rgba(255,255,255,.8); box-shadow: 0 4px 18px rgba(20,24,36,.18); touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(20,24,36,.3); transition: transform .12s; }
.joy.drag i { transition: none; background: #eaf1ff; }
.joy b { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-size: 9.5px; color: rgba(20,24,36,.55); font-weight: 700; pointer-events: none; letter-spacing: .04em; }
.joy.drag b { display: none; }
.acts { position: absolute; z-index: 6; right: max(14px, calc(env(safe-area-inset-right) + 8px)); bottom: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.acts .fab { width: 54px; height: 54px; font-size: 24px; }
.emobar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px; box-shadow: 0 2px 12px rgba(20,24,36,.18); max-width: min(300px, calc(100vw - 180px)); }
.emobar button { width: 42px; height: 42px; border-radius: 12px; font-size: 22px; }
.emobar button:active { background: var(--soft); }
.emobar button.on { background: var(--soft); outline: 2px solid var(--brand); }
.invite { position: absolute; z-index: 8; left: 50%; transform: translateX(-50%); top: 64px; width: min(340px, calc(100% - 24px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: 0 6px 24px rgba(20,24,36,.25); display: grid; gap: 10px; }
.invite .btns { display: flex; gap: 8px; justify-content: flex-end; }
.btn { padding: 9px 16px; border-radius: 12px; background: var(--soft); font-weight: 600; }
.btn.pri { background: var(--brand); color: var(--brand-ink); }
.sheet .box h3 { margin: 6px 6px 4px; font-size: 17px; }
.sheet .box .hint { margin: 0 6px 6px; font-size: 13px; color: var(--sub); }
.sheet .box.tall { max-height: 86vh; overflow-y: auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px 2px; }
.grid2 button, .grid3 button { padding: 12px 8px !important; border-radius: 12px !important; background: var(--soft); text-align: center !important; font-size: 15px !important; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px 2px; }
.grid2 button.on, .grid3 button.on { outline: 2px solid var(--brand); }
.sw { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 6px 8px; }
.sw button { width: 34px !important; height: 34px; padding: 0 !important; border-radius: 50% !important; border: 2px solid var(--line); }
.sw button.on { outline: 3px solid var(--brand); outline-offset: 2px; }
.lab { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--sub); padding: 8px 6px 2px; }
.preview { height: 200px; border-radius: 16px; background: var(--soft); position: relative; overflow: hidden; }
.preview canvas { width: 100% !important; height: 100% !important; display: block; }
.row2 { display: flex; gap: 8px; padding: 6px 2px 2px; }
.row2 > * { flex: 1; }
.cine-now { display: flex; gap: 10px; align-items: center; padding: 4px 6px; }
.cine-now img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; flex: none; background: var(--soft); }
.cine-now div { min-width: 0; }
.cine-now b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; }
.cine-now small { color: var(--sub); font-size: 12px; }
.player { aspect-ratio: 16 / 9; width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.field { display: flex; gap: 6px; padding: 6px 2px; }
.field input, .field textarea { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; }
.qa { display: grid; gap: 8px; padding: 4px 6px; }
.qa .q { justify-self: end; background: var(--mine); color: var(--mine-ink); border-radius: 14px; padding: 7px 11px; max-width: 85%; white-space: pre-wrap; }
.qa .a { justify-self: start; background: var(--soft); border-radius: 14px; padding: 8px 12px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.guide { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin: 0 2px; font-size: 14px; }
.guide ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.devs { display: grid; gap: 6px; padding: 2px; }
.devs div { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.devs div span { flex: 1; min-width: 0; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + var(--safe-b)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
/* nút tải app Android (trang mở bằng trình duyệt Android) */
.getapp { display: flex; flex-direction: column; align-items: center; gap: 1px; margin: 14px auto 0; padding: 10px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--brand); font-weight: 700; text-decoration: none; box-shadow: var(--shadow); }
.getbar { position: fixed; z-index: 30; left: 10px; right: 10px; top: calc(8px + var(--safe-t)); display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--ink); color: var(--card); box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13.5px; }
.getbar a { flex: 1; color: inherit; font-weight: 600; text-decoration: none; } .getbar button { color: inherit; width: 30px; height: 30px; border-radius: 50%; }
.getapp small { color: var(--sub); font-weight: 400; font-size: 12px; }
.fq-sheet { --muted: var(--sub); --text: var(--ink); --accent: var(--brand); --accent2: var(--brand); --accentSoft: var(--soft); --line: var(--line); max-height: 92vh; overflow-y: auto; }
.fq-btns { display: flex; gap: 8px; justify-content: flex-end; padding-top: 6px; } .fq-btns .btn { padding: 11px 18px; border-radius: 12px; background: var(--soft); font-weight: 600; } .fq-btns .btn.primary { background: var(--brand); color: var(--brand-ink); }
.fq-sheet .btn.primary.fq-shake { background: var(--brand); color: var(--brand-ink); padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 16px; }
/* ---------- Chat AI ---------- */
.ai-top h2 { display: flex; flex-direction: column; align-items: flex-start; }
.ai-model { font-size: 12.5px; font-weight: 600; color: var(--brand); padding: 1px 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ai-list { padding: 12px max(12px, env(safe-area-inset-right)) 16px max(12px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
.ai-u { align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.ai-ub { background: var(--mine); color: var(--mine-ink); border-radius: 18px 18px 4px 18px; padding: 8px 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ai-imgs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.ai-imgs img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; }

<body>
<div class="app" id="app"></div>
<script src="/m/ai.js"></script>
<script>
'use strict';
(() => {
  const API = '/v1/lobby';
  const $app = document.getElementById('app');
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* chế độ riêng tư */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* bỏ qua */ } },
  };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (crypto.getRandomValues(new Uint8Array(1))[0] & 15); return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
  const S = {
    token: LS.get('vpm.token', ''), name: LS.get('vpm.name', ''), device: LS.get('vpm.device', '') || (() => { const d = uuid(); LS.set('vpm.device', d); return d; })(),
    me: null, members: new Map(), names: new Map(), rooms: [], msgs: new Map(), more: new Map(), perms: {}, mutedUntil: null,
    view: 'rooms', room: null, online: false, reply: null, pending: [], lastRead: LS.get('vpm.read', {}), at: LS.get('vpm.at', {}), filter: '',
  };
  const os = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'mobile-ios' : /Android/i.test(navigator.userAgent) ? 'mobile-android' : 'mobile-web';
  const headers = (extra) => ({ authorization: 'Bearer ' + S.token, 'x-ltn-client-id': S.device, 'x-vanphong-os': os, 'x-vanphong-version': 'web', ...extra });

  // ---------- tiện ích giao diện ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  }
  const svg = (d) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.innerHTML = d; return s; };
  const IC = {
    chat: '<path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.2A8 8 0 1 1 21 12z"/>',
    lobby: '<path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01"/>',
    people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 4.8"/>',
    ai: '<path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
    back: '<path d="M15 18l-6-6 6-6"/>', send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
    out: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
  };
  function toast(t) {
    document.querySelectorAll('.toast').forEach((n) => n.remove());
    const n = el('div', { class: 'toast', role: 'status', text: t }); document.body.append(n);
    setTimeout(() => n.remove(), 3200);
  }
  const COLORS = ['#2563eb', '#7c3aed', '#db2777', '#ea580c', '#059669', '#0891b2', '#4f46e5', '#b45309'];
  const colorOf = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
  const initials = (n) => String(n || '?').trim().split(/\s+/).slice(-2).map((w) => w[0]).join('').toUpperCase() || '?';
  function avatar(id, name, { small, online } = {}) {
    if (id === 'all') return el('div', { class: 'av all' + (small ? ' sm' : '') }, '🏢');
    return el('div', { class: 'av' + (small ? ' sm' : ''), style: `background:${colorOf(id)}` }, initials(name), online ? el('i', { class: 'on' }) : null);
  }
  const hhmm = (ts) => new Date(ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  function when(ts) {
    const d = new Date(ts); const now = new Date();
    if (d.toDateString() === now.toDateString()) return hhmm(ts);
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Hôm qua';
    return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
  }
  const dayOf = (ts) => { const d = new Date(ts); const n = new Date(); if (d.toDateString() === n.toDateString()) return 'Hôm nay'; return d.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric' }); };
  const nameOf = (id) => (S.members.get(id) || {}).name || S.names.get(id) || 'Đồng nghiệp';
  const dmRoom = (a, b) => 'dm:' + [a, b].sort().join('~');

  // ---------- gọi Gateway ----------
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: headers(opts.headers) });
    if (res.status === 401) { logout(true); throw new Error('Phiên đăng nhập đã hết – quét lại mã QR trên máy tính nhé'); }
    let j = null; try { j = await res.json(); } catch { /* không phải JSON */ }
    if (!res.ok) throw new Error((j && j.error && j.error.message) || `Lỗi ${res.status}`);
    return j;
  }

  // ---------- đăng nhập bằng mã QR ----------
  async function claim(code) {
    renderLogin('Đang đăng nhập…');
    try {
      const device = os === 'mobile-ios' ? 'iPhone' : os === 'mobile-android' ? 'Android' : 'Trình duyệt';
      const res = await fetch('/v1/mobile/claim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code, device }) });
      const j = await res.json().catch(() => null);
      if (!res.ok) throw new Error((j && j.error && j.error.message) || `Lỗi ${res.status}`);
      S.token = j.token; S.name = j.name || '';
      LS.set('vpm.token', S.token); LS.set('vpm.name', S.name);
      start();
    } catch (e) { renderLogin('', e.message); }
  }
  async function logout(expired) {
    if (!expired && S.token) { try { await fetch('/v1/mobile/logout', { method: 'POST', headers: headers() }); } catch { /* vẫn đăng xuất trên máy */ } }
    if (S.ac) S.ac.abort();
    S.token = ''; LS.del('vpm.token'); LS.del('vpm.name');
    S.me = null; S.members.clear(); S.msgs.clear(); S.rooms = [];
    renderLogin('', expired ? 'Phiên đăng nhập đã hết – quét lại mã QR trên máy tính nhé' : '');
  }
  function renderLogin(busy, err) {
    $app.replaceChildren(el('div', { class: 'login' },
      el('img', { src: '/m/icon-192.png', alt: '' }),
      el('h1', { text: 'Sảnh Văn Phòng AI' }),
      el('p', { text: busy || 'Sảnh 3D, Chat AI và nhắn tin với đồng nghiệp ngay trên điện thoại.' }),
      err ? el('p', { class: 'err', text: err }) : null,
      busy ? null : el('ol', { class: 'steps' },
        el('li', {}, el('b', { text: '1' }), el('span', {}, 'Mở app ', el('strong', { text: 'Văn Phòng AI' }), ' trên máy tính, vào tab ', el('strong', { text: 'Sảnh' }), ', bấm nút ', el('strong', { text: '📱' }), ' – máy tính hiện mã QR và mã 8 ký tự.')),
        el('li', {}, el('b', { text: '2' }), el('span', { text: standalone() ? 'Gõ mã 8 ký tự vào ô dưới đây.' : 'Quét mã QR bằng Camera điện thoại, hoặc gõ mã 8 ký tự vào ô dưới đây.' }))),
      busy ? null : codeBox(),
      !busy && os === 'mobile-android' && !window.VPAndroid ? el('a', { class: 'getapp', href: '/m/VanPhongAI.apk', download: 'VanPhongAI.apk' }, '📲 Tải app Android', el('small', { text: 'Sảnh xoay ngang, mở nhanh như app' })) : null,
      el('div', { class: 'credit', text: 'Văn Phòng AI · Tạo bởi LTN' })));
  }

  // app đã "Thêm vào màn hình chính": iPhone cho bộ nhớ riêng (không nhận đăng nhập từ Safari) → đăng nhập bằng mã gõ tay
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  function codeBox() {
    const inp = el('input', { type: 'text', inputmode: 'text', autocapitalize: 'characters', autocomplete: 'one-time-code', placeholder: 'ABCD-EF23', maxlength: '9', 'aria-label': 'Mã đăng nhập 8 ký tự' });
    const go = () => { const v = inp.value.trim(); if (v.replace(/[\s-]/g, '').length >= 8) claim(v); else inp.focus(); };
    inp.addEventListener('input', () => { const v = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); inp.value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v; });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    return el('div', { class: 'codebox' }, inp, el('button', { onclick: go, text: 'Vào' }));
  }

  // ---------- luồng sự kiện Sảnh (SSE qua fetch để gửi được header) ----------
  async function connect() {
    if (S.ac) S.ac.abort();
    const ac = new AbortController(); S.ac = ac;
    try {
      const res = await fetch(API + '/stream', { headers: headers({ accept: 'text/event-stream' }), signal: ac.signal, cache: 'no-store' });
      if (res.status === 401) { logout(true); return; }
      if (!res.ok || !res.body) { let m = `Lỗi ${res.status}`; try { m = (await res.json()).error.message; } catch { /* bỏ qua */ } throw new Error(m); }
      S.retry = 0;
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          let ev = 'message'; const data = [];
          for (const line of chunk.split('\n')) { if (line.startsWith('event:')) ev = line.slice(6).trim(); else if (line.startsWith('data:')) data.push(line.slice(5).trimStart()); }
          if (data.length) { try { onEvent(ev, JSON.parse(data.join('\n'))); } catch { /* sự kiện lạ */ } }
        }
      }
      throw new Error('Mất kết nối');
    } catch (e) {
      if (ac.signal.aborted) return;
      setOnline(false, e.message);
      S.retry = Math.min((S.retry || 0) + 1, 6);
      clearTimeout(S.retryTimer);
      S.retryTimer = setTimeout(() => { if (document.visibilityState === 'visible') connect(); }, 800 * 2 ** S.retry);
    }
  }
  function setOnline(on, why) { S.online = on; S.netErr = on ? '' : why || ''; const n = document.querySelector('.net'); if (n) { n.classList.toggle('on', on); n.title = on ? 'Đã kết nối' : 'Đang kết nối lại…'; } }

  function onEvent(ev, d) {
    switch (ev) {
      case 'hello':
        S.me = d.me; S.perms = d.perms || {}; S.mutedUntil = d.mutedUntil || null; S.rooms = d.rooms || [];
        S.members.clear(); for (const m of d.members || []) S.members.set(m.id, m);
        if (S.me) S.names.set(S.me.id, S.me.name);
        for (const r of S.rooms) if (r.with) S.names.set(r.with, r.name);
        L3.cinema = d.cinema || null; if (d.cinema && d.cinema.now) L3.skew = d.cinema.now - Date.now();
        L3.cat = d.cat || null; L3.npc = d.npc || null;
        setOnline(true); render();
        if (S.room) loadMsgs(S.room, true); // vừa nối lại → lấy tin bị lỡ
        sync3D();
        break;
      case 'member': S.members.set(d.id, d); S.names.set(d.id, d.name); refreshLists(); sync3D(); break;
      case 'leave': S.members.delete(d.id); refreshLists(); sync3D(); break;
      case 'roster': for (const id of [...S.members.keys()]) if (!(d.ids || []).includes(id)) S.members.delete(id); refreshLists(); sync3D(); break;
      case 'move': { const m = S.members.get(d.id); if (m) m.pos = { x: d.x, z: d.z, seat: d.seat || null }; if (L3.scene) L3.scene.moveMember(d.id, d.x, d.z, d.seat || null); break; }
      case 'emote': if (L3.scene) L3.scene.emote(d.id, d.emote); break;
      case 'dance': { const m = S.members.get(d.id); if (m) m.dance = d.style || null; if (L3.scene) L3.scene.setDance(d.id, d.style || null); break; }
      case 'interact': onInteract(d); break;
      case 'cinema': L3.cinema = d; if (d.now) L3.skew = d.now - Date.now(); drawOverlay(); if (L3.cineOpen) openCinema(true); break;
      case 'cat': L3.cat = d; if (L3.scene) L3.scene.setCat(d); break;
      case 'npc': L3.npc = d.npc || null; if (L3.scene) L3.scene.setNpc(L3.npc); break;
      case 'personal': S.perms = d.perms || S.perms; S.mutedUntil = d.mutedUntil || null; if (S.view === 'room') renderCompose(); break;
      case 'me': break;
      case 'message': addMsg(d); if (L3.scene && d.room === 'all' && d.text) L3.scene.say(d.from, d.text); break;
      case 'message-delete': {
        const list = S.msgs.get(d.room);
        if (list) { const i = list.findIndex((x) => x.id === d.id); if (i >= 0) list.splice(i, 1); }
        if (S.view === 'room' && S.room === d.room) renderMsgs(false);
        break;
      }
      default: break;
    }
  }

  function addMsg(m) {
    S.names.set(m.from, m.name);
    let r = S.rooms.find((x) => x.id === m.room);
    if (!r && m.room.startsWith('dm:')) { const other = m.room.slice(3).split('~').find((x) => x !== S.me.id) || S.me.id; r = { id: m.room, kind: 'dm', with: other, name: nameOf(other) }; S.rooms.push(r); }
    if (r) r.last = { ts: m.ts, from: m.from, name: m.name, preview: m.text || (m.images ? '📷 Ảnh' : '') };
    const list = S.msgs.get(m.room);
    if (list && !list.some((x) => x.id === m.id)) list.push(m);
    const mine = m.from === (S.me && S.me.id);
    const here = S.view === 'room' && S.room === m.room && document.visibilityState === 'visible';
    if (here || mine) markRead(m.room, m.ts);

  // ---------- đoạn chat ----------

  async function loadMsgs(room, scroll, before) {

  const URLS = /(https?:\/\/[^\s<>"']+)/g;
  function richText(m) {

    const pushText = (t) => {
      let rest = t;
      while (rest) {
        let hit = null; let at = -1;
        for (const n of names) { const i = rest.indexOf(n.tag); if (i >= 0 && (at < 0 || i < at)) { at = i; hit = n; } }
        const urlM = rest.match(URLS); const ui = urlM ? rest.indexOf(urlM[0]) : -1;
        if (ui >= 0 && (at < 0 || ui < at)) {
          frag.append(rest.slice(0, ui)); frag.append(el('a', { href: urlM[0], target: '_blank', rel: 'noopener noreferrer', text: urlM[0] })); rest = rest.slice(ui + urlM[0].length); continue;
        }

        frag.append(rest.slice(0, at)); frag.append(el('span', { class: 'at', text: hit.tag })); rest = rest.slice(at + hit.tag.length);
      }
    };
    pushText(m.text || '');
    return frag;
  }

  const blobs = new Map();
  async function imgUrl(id, thumb) {

  function renderMsgs(toBottom) {

  // ---------- gõ & gửi ----------

  // @tên: gợi ý người online + người đã nhắn trong phòng
  function suggest(ta, box) {
    const m = ta.value.slice(0, ta.selectionStart).match(/(^|\s)@([^\s@]{0,20})$/);
    if (!m) { box.hidden = true; return; }
    const q = m[2].toLowerCase();
    const pool = new Map();
    if (S.room === 'all') { for (const p of S.members.values()) pool.set(p.id, p.name); for (const x of S.msgs.get('all') || []) if (x.from !== S.me.id) pool.set(x.from, x.name); }
    else { const r = S.rooms.find((x) => x.id === S.room); if (r) pool.set(r.with, nameOf(r.with)); }
    const hits = [...pool.entries()].filter(([, n]) => n.toLowerCase().includes(q)).slice(0, 8);
    if (S.room === 'all' && S.perms.everyone && 'mọi người'.includes(q)) hits.unshift(['all', 'mọi người']);
    if (!hits.length) { box.hidden = true; return; }
    box.hidden = false;
    box.replaceChildren(...hits.map(([id, n]) => el('button', { onclick: () => {

  // nén ảnh trên điện thoại: ảnh đầy đủ ≤ 1600px + ảnh thu nhỏ ≤ 360px (giống app máy tính)
  async function encode(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
    const src = bmp || await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = URL.createObjectURL(file); });
    const w0 = src.width; const h0 = src.height;
    const draw = async (max, q) => {
      const k = Math.min(1, max / Math.max(w0, h0)); const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
      const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); // ảnh PNG trong suốt → nền trắng (JPEG không có nền trong)
      g.drawImage(src, 0, 0, c.width, c.height);
      return { blob: await new Promise((ok) => c.toBlob(ok, 'image/jpeg', q)), w: c.width, h: c.height };
    };
    const full = await draw(1600, 0.85); const thumb = await draw(360, 0.72);
    return { full, thumb };
  }

  async function askFortune({ name, team, level, n, date }) {
    const h = headers();

    const ids = ((ms && ms.data) || []).map((m) => m.id).filter((id) => !/image|tts|whisper|embed|video|veo|sora|imagen|flux|audio/i.test(id));

    if (!model) throw new Error('Chưa có model');
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 25000);
    try {
      const wd = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'][new Date().getDay()];

      const m = /\{[\s\S]*\}/.exec(text || ''); const o = m ? JSON.parse(m[0]) : null;
      const clean = (v, max) => String(v || '').replace(/\s+/g, ' ').trim().slice(0, max);

  // cần điều khiển: kéo ra xa tâm = đi nhanh, thả tay = dừng
  function joystick() {
    const knob = el('i'); const pad = el('div', { class: 'joy', role: 'application', 'aria-label': 'Cần điều khiển: kéo để đi lại' }, el('b', { text: 'KÉO ĐỂ ĐI' }), knob);
    let id = null; let cx = 0; let cy = 0;
    const R = 50;
    const move = (e) => {
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const d = Math.hypot(dx, dy); if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      if (L3.scene) L3.scene.setStick(dx / R, dy / R);
    };
    pad.addEventListener('pointerdown', (e) => {
      e.preventDefault(); id = e.pointerId; pad.setPointerCapture(id); pad.classList.add('drag');
      const r = pad.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; move(e);
      if (L3.scene) L3.scene.focusSelf();
    });
    pad.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
    const end = (e) => { if (e.pointerId !== id) return; id = null; pad.classList.remove('drag'); knob.style.transform = ''; if (L3.scene) L3.scene.setStick(0, 0); };
    pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
    return pad;
  }

    };
    const sh = bigSheet('Trạng thái của bạn', 'Đồng nghiệp thấy trên bảng tên và danh sách online.', el('div', { class: 'grid2' },
      MY_STATUS.map(([k, ic, name]) => el('button', { class: (k ? cur.includes(name) : !MY_STATUS.some((x) => x[0] && cur.includes(x[2]))) ? 'on' : '', onclick: () => set(k) }, `${ic} ${name}`))));
  }

  function openWardrobe() {
    const look = window.avatarToLook ? window.avatarToLook({ id: S.me.id, avatar: S.me.avatar }) : {};
    let draft = { hairStyle: 'short', accessory: 'none', ...look, ...(S.me.avatar || {}) };
    delete draft.id; delete draft.name;
    const pv = el('div', { class: 'preview' }); let preview = null;
    const body = el('div', {});
    const paint = () => {
      if (preview) preview.update({ id: S.me.id, avatar: draft });
      const chips = (key, list) => el('div', { class: 'grid3' }, list.map(([v, t]) => el('button', { class: draft[key] === v ? 'on' : '', onclick: () => { draft[key] = v; paint(); } }, t)));
      const sw = (key) => el('div', { class: 'sw' }, PALETTE[key].map((c) => el('button', { class: draft[key] === c ? 'on' : '', style: `background:${c}`, 'aria-label': c, onclick: () => { draft[key] = c; paint(); } })));
      body.replaceChildren(
        el('div', { class: 'lab', text: 'Kiểu tóc' }), chips('hairStyle', HAIR), el('div', { class: 'lab', text: 'Màu tóc' }), sw('hair'),
        el('div', { class: 'lab', text: 'Màu da' }), sw('skin'), el('div', { class: 'lab', text: 'Áo' }), sw('shirt'),
        el('div', { class: 'lab', text: 'Quần' }), sw('pants'), el('div', { class: 'lab', text: 'Giày' }), sw('shoes'),
        el('div', { class: 'lab', text: 'Phụ kiện' }), chips('accessory', ACC), el('div', { class: 'lab', text: 'Màu điểm nhấn' }), sw('accent'));
    };
    const rnd = (a) => a[Math.floor(Math.random() * a.length)];
    const save = async () => {
      try { const r = await post('profile', { avatar: draft }); S.me = { ...S.me, ...(r.me || {}), avatar: draft }; sync3D(); drawOverlay(); sh.close(); toast('👕 Đã lưu nhân vật – mọi người trong Sảnh đều thấy'); }
      catch (e) { toast(e.message); }
    };
    const sh = bigSheet('👕 Tủ đồ', 'Bấm vào nhân vật của mình trong Sảnh cũng mở được Tủ đồ.', el('div', {}, pv,
      el('div', { class: 'row2' }, el('button', { class: 'btn', onclick: () => { draft = { hairStyle: rnd(HAIR)[0], hair: rnd(PALETTE.hair), skin: rnd(PALETTE.skin), shirt: rnd(PALETTE.shirt), pants: rnd(PALETTE.pants), shoes: rnd(PALETTE.shoes), accessory: rnd(ACC)[0], accent: rnd(PALETTE.accent) }; paint(); } }, '🎲 Ngẫu nhiên'), el('button', { class: 'btn pri', onclick: save }, 'Lưu')),
      body), { onClose: () => { if (preview) preview.destroy(); pause3D(S.view !== 'lobby'); } });
    pause3D(true); // đang thử đồ: dừng vẽ Sảnh cho đỡ nóng máy
    if (window.AvatarPreview) { try { preview = new window.AvatarPreview(pv); } catch { preview = null; } }
    paint();
  }

  function personMenu(id) {
    const m = S.members.get(id); if (!m) return;
    const act = (kind) => async () => {
      try {
        const r = await post('interact', { to: id, kind, style: kind === 'dance' ? (L3.myDance || 'groove') : undefined });
        toast(r && r.asked ? `💌 Đã mời ${m.name} ${KIND[kind][1].toLowerCase()} – chờ trả lời…` : `${KIND[kind][0]} ${KIND[kind][1]} với ${m.name}`);
      } catch (e) { toast(e.message); }
    };
    sheet([
      { text: `💬 Nhắn riêng cho ${m.name}`, run: () => { S.lastTab = 'lobby'; openDm(id); } },
      { text: '🚶 Đi tới chỗ ' + m.name, run: () => { if (L3.scene && m.pos) L3.scene.walkSelf(m.pos.x + 0.8, m.pos.z + 0.4, true); } },
      ...Object.keys(KIND).map((k) => ({ text: `${KIND[k][0]} ${KIND[k][1]}`, run: act(k) })),
    ]);
  }

  function onInteract(d) {
    if (d.state === 'ask') return showInvite(d);
    if (d.state === 'declined') { toast(`${d.byName} để dịp khác nhé 😅`); return; }
    if (d.state !== 'go') return;
    if (L3.scene) L3.scene.interact(d);
    if (d.b === S.me.id) toast(`${(KIND[d.kind] || ['✨'])[0]} ${d.aName} ${(KIND[d.kind] || ['', ''])[1].toLowerCase()} với bạn`);
    if (d.kind === 'dance' && (d.a === S.me.id || d.b === S.me.id)) { L3.myDance = d.style; drawOverlay(); }
  }
  function showInvite(d) {
    document.querySelectorAll('.invite').forEach((n) => n.remove());
    const answer = (accept) => { box.remove(); post('interact', { id: d.id, accept }).catch((e) => toast(e.message)); };
    const box = el('div', { class: 'invite', role: 'alertdialog' },
      el('div', {}, el('b', { text: `${d.fromName} mời bạn ${d.kind === 'dance' ? 'nhảy cùng 💃' : 'ôm một cái 🤗'}` })),
      el('div', { class: 'btns' }, el('button', { class: 'btn', onclick: () => answer(false) }, 'Để sau'), el('button', { class: 'btn pri', onclick: () => answer(true) }, d.kind === 'dance' ? '💃 Nhảy!' : '🤗 Đồng ý')));
    (document.getElementById('stage') || document.body).append(box);
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    setTimeout(() => box.remove(), Math.max(3000, (d.exp || Date.now() + 25000) - Date.now()));
  }

  function catMenu() {
    const go = (action) => post('cat', { action }).catch((e) => toast(e.message));
    sheet([{ text: '🤚 Vuốt ve Mít', run: () => go('pet') }, { text: '🍖 Cho Mít ăn', run: () => go('feed') }, { text: '🧶 Chơi len với Mít', run: () => go('play') }, { text: '🐾 Gọi Mít đi theo', run: () => go('call') }]);
  }

  // ---------- màn chiếu: xem cùng cả Sảnh (đúng đoạn đang chiếu) ----------
  const ytThumb = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`;
  function openCinema(refresh) {
    if (refresh) { document.querySelectorAll('.sheet.cine').forEach((n) => n.remove()); }
    L3.cineOpen = true;
    const st = L3.cinema || {}; const cur = st.current;
    const player = el('div', {});
    const watch = () => {
      if (!cur) return;
      const pos = Math.max(0, Math.floor((Date.now() + (L3.skew || 0) - cur.startedAt) / 1000));
      const q = new URLSearchParams({ autoplay: '1', start: String(pos), playsinline: '1', rel: '0', modestbranding: '1' });
      player.replaceChildren(el('div', { class: 'player' }, el('iframe', { src: `https://www.youtube.com/embed/${encodeURIComponent(cur.videoId)}?${q}`, allow: 'autoplay; encrypted-media; picture-in-picture', allowfullscreen: true, referrerpolicy: 'strict-origin-when-cross-origin', title: cur.title || 'Video' })));
    };
    const url = el('input', { type: 'url', placeholder: 'Dán link YouTube để thêm vào màn chiếu', enterkeyhint: 'send' });
    const add = async () => { const v = url.value.trim(); if (!v) return; try { await post('cinema', { action: 'add', url: v }); url.value = ''; toast('🎬 Đã thêm vào màn chiếu'); } catch (e) { toast(e.message); } };
    url.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } });
    const queue = (st.queue || []).slice(0, 6);
    const sh = bigSheet('🎬 Màn chiếu SIMI', cur ? 'Đang chiếu cho cả Sảnh – bấm Xem cùng để xem đúng đoạn mọi người đang xem.' : 'Chưa có video nào đang chiếu.', el('div', {},
      cur ? el('div', { class: 'cine-now' }, el('img', { src: ytThumb(cur.videoId), alt: '' }), el('div', {}, el('b', { text: cur.title || 'Video YouTube' }), el('small', { text: cur.byName ? `${cur.byName} chọn` : '' }))) : null,
      player,
      cur ? el('div', { class: 'row2' }, el('button', { class: 'btn pri', onclick: watch }, '▶ Xem cùng'), el('button', { class: 'btn', onclick: () => post('cinema', { action: 'skip' }).then(() => toast('Đã bỏ phiếu chuyển video')).catch((e) => toast(e.message)) }, '⏭ Chuyển')) : null,
      queue.length ? el('div', { class: 'lab', text: `Chờ chiếu (${(st.queue || []).length})` }) : null,
      queue.length ? el('div', { class: 'list' }, queue.map((v) => el('div', { class: 'row' }, el('img', { src: ytThumb(v.videoId), alt: '', style: 'width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:8px' }), el('div', { class: 'grow' }, el('b', { text: v.title || 'Video' }), el('span', { class: 'sub', text: v.byName || '' }))))) : null,
      S.perms.cinema !== false && !st.locked ? el('div', { class: 'field' }, url, el('button', { class: 'btn pri', onclick: add, text: 'Thêm' })) : el('p', { class: 'hint', text: st.locked ? 'Admin đang khoá màn chiếu.' : 'Bạn chưa được bật quyền thêm video.' })),
      { onClose: () => { L3.cineOpen = false; } });
    sh.n.classList.add('cine');
  }

  // ---------- Trợ lý SIMI: hướng dẫn có sẵn + hỏi đáp ----------
  async function openNpc() {
    if (!window.VPNpcGuides) { try { await loadJs('/m/sanh3d/npc-guides.js'); } catch { /* vẫn hỏi được */ } }
    let guides = null;
    try { const r = await api(`${API}/npc`); guides = r.guides || null; } catch { /* Gateway cũ */ }
    const G = guides || (window.VPNpcGuides && window.VPNpcGuides.GUIDES) || [];
    const qa = el('div', { class: 'qa' });
    const paintQa = () => qa.replaceChildren(...L3.qa.flatMap((x) => [el('div', { class: 'q', text: x.q }), el('div', { class: 'a', text: x.a || '…' })]));
    paintQa();
    const input = el('input', { type: 'text', placeholder: 'Hỏi Trợ lý SIMI… (VD: cách tạo ảnh)', maxlength: '500', enterkeyhint: 'send' });
    const ask = async () => {
      const q = input.value.trim(); if (!q) return;
      input.value = ''; const item = { q, a: '' }; L3.qa.push(item); paintQa();
      try {
        const guide = window.VPNpcGuides ? window.VPNpcGuides.guideText(guides) : '';
        const history = L3.qa.slice(-6, -1).flatMap((x) => [{ role: 'user', content: x.q }, { role: 'assistant', content: x.a }]);
        const r = await api(`${API}/npc/ask`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: q, history, guide }) });
        item.a = String(r.answer || '').replace(/\*\*(.+?)\*\*/g, '$1');
      } catch (e) { item.a = '⚠️ ' + e.message; }
      paintQa(); qa.lastChild && qa.lastChild.scrollIntoView({ block: 'nearest' });
      if (L3.scene) L3.scene.npcSay('Mình trả lời rồi nhé 😉', 2500);
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ask(); } });
    const topics = el('div', { class: 'grid2' }, G.slice(0, 10).map((g) => el('button', { onclick: () => {
      document.querySelectorAll('.guide').forEach((n) => n.remove());
      topics.after(el('div', { class: 'guide' }, el('b', { text: g.title }), el('ol', {}, g.steps.map((s2) => el('li', { text: s2.text })))));
    } }, g.title)));
    bigSheet('❓ Trợ lý SIMI', 'Chọn hướng dẫn có sẵn hoặc hỏi bất cứ điều gì về Văn Phòng AI.', el('div', {}, topics, qa, el('div', { class: 'field' }, input, el('button', { class: 'btn pri', onclick: ask, text: 'Hỏi' }))));
    if (L3.scene) L3.scene.npcWave();
  }

  // ---------- vòng đời ----------
  // cho tab Chat AI (ai.js) dùng chung tiện ích
  window.VPM = { el, svg, IC, toast, headers, LS, S, tabBar, askLogout, avatar, bigSheet, sheet, app: $app };
  S.landscape = LS.get('vpm.land', false);
  // nút Back của Android: đóng bảng / về tab trước thay vì thoát app
  window.vpmBack = () => {
    const sh = document.querySelectorAll('.sheet'); if (sh.length) { sh[sh.length - 1].remove(); return true; }
    if (S.view === 'room') { closeRoom(); return true; }
    if (S.view !== 'lobby' && S.token) { S.view = S.lastTab = 'lobby'; LS.set('vpm.tab', 'lobby'); render(); return true; }
    return false;
  };
  function start() {
    history.replaceState(null, '', '/m');
    S.view = S.lastTab = LS.get('vpm.tab', 'lobby'); render(); connect();
  }
  document.addEventListener('visibilitychange', () => {
    pause3D(document.visibilityState !== 'visible' || S.view !== 'lobby');
    if (document.visibilityState !== 'visible' || !S.token) return;
    // điện thoại khoá màn hình → trình duyệt cắt kết nối; mở lại thì nối lại ngay và lấy tin bị lỡ
    if (!S.online) { clearTimeout(S.retryTimer); S.retry = 0; connect(); }
    else if (S.room) loadMsgs(S.room, false);
  });
  window.addEventListener('online', () => { if (S.token && !S.online) { S.retry = 0; connect(); } });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/m/sw.js', { scope: '/m' }).catch(() => { /* chạy được không cần */ });

  const pairCode = () => new URLSearchParams(location.hash.slice(1)).get('pair');
  // trang đang mở sẵn mà quét mã mới (chỉ đổi phần #pair=…) cũng đăng nhập luôn
  window.addEventListener('hashchange', () => { const c = pairCode(); if (c) { history.replaceState(null, '', '/m'); if (S.ac) S.ac.abort(); claim(c); } });
  const pair = pairCode();
  if (pair) { history.replaceState(null, '', '/m'); claim(pair); }
  else if (S.token) start();
  else renderLogin();
})();
</script>
</body>
</html>
